name: ai-incident-commander

services:
  observability-mcp:
    image: ai-incident-commander/observability-mcp:local
    user: "10001:10001"

    environment:
      AIC_OBSERVABILITY_MCP_CONFIG: /run/config/observability-mcp-runtime.json

    # Private HTTPS endpoint for MCP clients.
    command:
      - uvicorn
      - ai_incident_commander.application.observability_mcp_runtime:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --ssl-certfile
      - /run/tls/server.crt
      - --ssl-keyfile
      - /run/tls/server.key

    volumes:
      - type: bind
        source: ${HOME}/.config/ai-incident-commander/mcp/observability/server.crt
        target: /run/tls/server.crt
        read_only: true

      - type: bind
        source: ${HOME}/.config/ai-incident-commander/mcp/observability/server.key
        target: /run/tls/server.key
        read_only: true

      # Trusted runtime configuration, outside the Git worktree.
      - type: bind
        source: ${HOME}/.config/ai-incident-commander/mcp/observability/runtime.json
        target: /run/config/observability-mcp-runtime.json
        read_only: true

      # Local CA for verifying Keycloak HTTPS.
      - type: bind
        source: ${HOME}/.config/ai-incident-commander/keycloak/pki/dev-ca.crt
        target: /run/ca/dev-ca.crt
        read_only: true

      # Dedicated OAuth introspection client secret.
      - type: bind
        source: ${HOME}/.config/ai-incident-commander/keycloak/clients/observability-mcp-introspection.secret
        target: /run/secrets/observability_mcp_introspection_secret
        read_only: true

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m

    # Internal container port only. No host port publishing.
    expose:
      - "8000"

    networks:
      - mcp_internal
      - observability
      - identity_ingress

networks:
  mcp_internal:
    internal: true

  observability:
    external: true
    name: ai-incident-commander_observability

  identity_ingress:
    external: true
    name: ai-incident-commander_identity_ingress
