name: ai-incident-commander-tests

services:
  observability-e2e:
    image: ai-incident-commander/observability-mcp-tests:local

    profiles:
      - integration

    user: "10001:10001"
    stdin_open: true
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m

    volumes:
      - type: bind
        source: ./tests/integration
        target: /app/tests/integration
        read_only: true

      - type: bind
        source: ${HOME}/.config/ai-incident-commander/keycloak/pki/dev-ca.crt
        target: /run/ca/dev-ca.crt
        read_only: true

    environment:
      AIC_TEST_MCP_URL: https://observability-mcp:8000/mcp
      AIC_TEST_MCP_CA_FILE: /run/ca/dev-ca.crt
      AIC_TEST_OTLP_URL: http://alloy:4318/v1/logs

    networks:
      - mcp_internal
      - otlp_ingress

networks:
  mcp_internal:
    external: true
    name: ai-incident-commander_mcp_internal

  otlp_ingress:
    external: true
    name: ai-incident-commander_otlp_ingress
