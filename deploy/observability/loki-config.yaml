# Single-binary Loki for a private, single-node Docker Compose environment.
# Not an HA production topology. A trusted gateway must authenticate callers
# before passing X-Scope-OrgID; that header alone is NOT authorization.
auth_enabled: true

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# TSDB v13 supports structured metadata and is the recommended Loki index.
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  max_query_length: 1h
  max_entries_limit_per_query: 100
  query_timeout: 30s

# Retention is enforced asynchronously by the Compactor, not by Docker volumes.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
