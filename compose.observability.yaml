# Local, single-node Observability backend. Merge with the existing compose.yaml:
# docker compose -f compose.yaml -f compose.observability.yaml up -d --no-deps loki
# Loki has no published ports. Alloy receives authenticated OTLP HTTP on a
# host-loopback-only port for a trusted local application. Not a public ingress.
services:
  loki:
    # Version and digest pinned to the upstream Grafana Loki release example.
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -target=all
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    networks:
      - observability
    healthcheck:
      # Grafana's official image is distroless (no curl or wget).
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s
    stop_grace_period: 60s
    # Deliberately no ports: Loki is NOT an authenticated public API.

  alloy:
    # Fixed upstream release; do not use :latest. Pin an image digest after
    # checking the image manifest for the deployment platform.
    image: grafana/alloy:v1.22.0
    user: "473:473"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    secrets:
      - otlp_htpasswd
    environment:
      # One trusted local tenant for this collector. Must match the MCP ACL.
      AIC_LOKI_TENANT: ${AIC_LOKI_TENANT:?set AIC_LOKI_TENANT}
    ports:
      # LOCAL DEVELOPMENT ONLY: use TLS/authenticated ingress for remote senders.
      - "127.0.0.1:${AIC_OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - observability
      - otlp_ingress
    stop_grace_period: 30s

volumes:
  loki_data:
  alloy_data:

secrets:
  # An existing htpasswd file OUTSIDE the Git worktree. Never commit it.
  otlp_htpasswd:
    file: ${AIC_OTLP_HTPASSWD_FILE:?set AIC_OTLP_HTPASSWD_FILE}

networks:
  observability:
    internal: true

  otlp_ingress:
    driver: bridge
